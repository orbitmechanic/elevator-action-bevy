[package]
name = "elevator-action-bevy"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A 2D sprite-based Elevator Action-inspired arcade game built with Bevy"
license = "MIT"
repository = "https://github.com/orbitmechanic/elevator-action-bevy"
keywords = ["bevy", "game", "arcade", "pixel-art"]
categories = ["games"]

[dependencies]
bevy = { version = "0.20.1", features = ["wav"] }

[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
