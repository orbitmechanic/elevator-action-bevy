<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b13"/>
      <stop offset="0.6" stop-color="#0e1728"/>
      <stop offset="1" stop-color="#1a1020"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070b13" stop-opacity="0"/>
      <stop offset="1" stop-color="#070b13" stop-opacity="0.72"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 0H32M0 0V32" fill="none" stroke="#1d2c46" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>

  <!-- elevator shaft motif -->
  <g opacity="0.6">
    <rect x="34" y="0" width="2" height="640" fill="#2c405f"/>
    <rect x="74" y="0" width="2" height="640" fill="#2c405f"/>
    <rect x="54" y="0" width="1" height="640" fill="#59313c"/>
    <g stroke="#223650" stroke-width="1">
      <path d="M34 90H76M34 180H76M34 270H76M34 360H76M34 450H76M34 540H76"/>
    </g>
    <rect x="544" y="0" width="2" height="640" fill="#2c405f"/>
    <rect x="584" y="0" width="2" height="640" fill="#2c405f"/>
  </g>

  <!-- red elevator arrow -->
  <g fill="#c62c3a">
    <rect x="112" y="66" width="10" height="150"/>
    <rect x="110" y="66" width="4" height="150" fill="#e4424f"/>
    <path d="M104 212 L124 212 L117 236 Z"/>
  </g>

  <text x="142" y="94" font-family="Arcade 17" font-size="20" fill="#5ee0d5">A BEVY 0.20 ARCADE TRIBUTE</text>

  <g font-family="Arcade 17" font-weight="normal">
    <text x="140" y="170" font-size="80" fill="#f4e7c6">ELEVATOR</text>
    <text x="140" y="252" font-size="80" fill="#d93442">ACTION</text>
  </g>
  <text x="142" y="292" font-family="Arcade 17" font-size="24" fill="#5ee0d5">RED DOOR PROTOCOL</text>

  <g font-family="DejaVu Sans" font-size="19" fill="#b8c4d8">
    <text x="142" y="352">Ride the elevators. Crack the red doors.</text>
    <text x="142" y="380">Take the files. Get out before the night desk</text>
    <text x="142" y="408">sends the whole floor after you.</text>
  </g>

  <g font-family="Arcade 17" font-size="16">
    <text x="142" y="470" fill="#ffd463">A/D MOVE   J SHOOT   K JUMP   W RIDE</text>
    <text x="142" y="498" fill="#8d9bb1">3 STAGES   8 FLOORS   2 ELEVATORS   1 WAY OUT</text>
  </g>

  <text x="142" y="574" font-family="DejaVu Sans Mono" font-size="17" fill="#e7edf7">github.com/orbitmechanic/elevator-action-bevy</text>
  <text x="142" y="600" font-family="DejaVu Sans" font-size="14" fill="#68758a">Rust / Bevy 0.20.1 · Krita pixel art · original chiptune soundtrack</text>

  <!-- screenshot frame -->
  <g transform="translate(620 92)">
    <rect x="-8" y="-8" width="616" height="466" fill="#05080d" stroke="#2a3c59" stroke-width="2"/>
    <rect x="-8" y="-8" width="616" height="466" fill="none" stroke="#c62c3a" stroke-width="3" opacity="0.9"/>
    <image href="gameplay.png" x="0" y="0" width="600" height="450" image-rendering="optimizeSpeed"/>
    <rect x="0" y="0" width="600" height="450" fill="url(#fade)" opacity="0.18"/>
  </g>
  <text x="620" y="588" font-family="Arcade 17" font-size="16" fill="#7fffc0">STAGE 1 - THE HOTEL MERIDIAN</text>

  <!-- corner stamps -->
  <g font-family="Arcade 17" font-size="14" fill="#4d5d77">
    <text x="1160" y="604">1983 - 2026</text>
    <text x="50" y="616">AGENT 17</text>
  </g>
  <rect x="24" y="24" width="1232" height="592" fill="none" stroke="#23344f" stroke-width="2"/>
</svg>
